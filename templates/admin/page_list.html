{% extends "admin/layout.html" %}
{% block content %}
  <h1>Pages</h1>
  <p><a href="/admin/pages/new">New page</a></p>
  {% if pages %}
  <table>
    <thead><tr><th>Title</th><th>Status</th><th>Last update</th><th>Actions</th></tr></thead>
    <tbody>
    {% for p in pages %}
      <tr>
        <td><a href="/admin/pages/{{ p.id }}/edit">{{ p.title }}</a></td>
        <td>{{ p.status }}</td>
        <td>{{ p.updated_at }}</td>
        <td>
          <form method="post" action="/admin/pages/{{ p.id }}/{{ 'unpublish' if p.status == 'published' else 'publish' }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <button type="submit">{{ 'Mark draft' if p.status == 'published' else 'Mark published' }}</button>
          </form>
          <form method="post" action="/admin/pages/{{ p.id }}/delete" onsubmit="return confirm('Delete this page?')">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <button type="submit">Delete</button>
          </form>
        </td>
      </tr>
    {% endfor %}
    </tbody>
  </table>
  {% else %}
  <p>No pages yet.</p>
  {% endif %}
{% endblock %}
