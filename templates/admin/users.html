{% extends "admin/layout.html" %}
{% block content %}
  <h1>Users</h1>
  <table>
    <thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th>Actions</th></tr></thead>
    <tbody>
    {% for u in users %}
      <tr>
        <td>{{ u.name }}{% if u.id == user["id"] %} (you){% endif %}</td>
        <td>{{ u.email }}</td>
        <td>
          <form method="post" action="/admin/users/{{ u.id }}/role">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <select name="role" aria-label="Role for {{ u.name }}">
              {% for r in roles %}<option value="{{ r }}"{% if r == u.role %} selected{% endif %}>{{ r }}</option>{% endfor %}
            </select>
            <button type="submit">Change role</button>
          </form>
        </td>
        <td>{{ 'active' if u.active else 'deactivated' }}</td>
        <td>
          <form method="post" action="/admin/users/{{ u.id }}/{{ 'deactivate' if u.active else 'reactivate' }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <button type="submit">{{ 'Deactivate' if u.active else 'Reactivate' }}</button>
          </form>
        </td>
      </tr>
    {% endfor %}
    </tbody>
  </table>

  <h2>Add a user</h2>
  <form method="post" action="/admin/users">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label for="name">Name</label>
    <input id="name" name="name" value="{{ form.name }}" required>
    <label for="email">Email</label>
    <input id="email" name="email" type="email" value="{{ form.email }}" required>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="new-password" required>
    <label for="role">Role</label>
    <select id="role" name="role">
      {% for r in roles %}<option value="{{ r }}"{% if r == form.role %} selected{% endif %}>{{ r }}</option>{% endfor %}
    </select>
    <p><button type="submit">Create user</button></p>
  </form>
{% endblock %}
